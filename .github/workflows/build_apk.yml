name: build_apk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 版本号 如 v0.1.0
        required: true
        type: string
      publish:
        description: 是否发布 Release
        required: false
        default: false
        type: boolean

env:
  COCOS_VERSION: 3.8.8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: 跨目录导入消解
        run: |
          sed -i 's#"\.\./\.\./src/#"./lib/#g' assets/scripts/bootstrap_bridge.ts
          cp -r src assets/scripts/lib
          find assets/scripts/lib -name "*.test.ts" -delete
      - name: 安装 Cocos Creator
        env:
          CREATOR_LICENSE: ${{ secrets.CREATOR_LICENSE }}
          CREATOR_DOWNLOAD_URL: ${{ secrets.CREATOR_DOWNLOAD_URL }}
        run: |
          url="${CREATOR_DOWNLOAD_URL:-https://download.cocos.com/CocosCreator/v${COCOS_VERSION}/CocosCreator-v${COCOS_VERSION}-linux-x86_64.tar}"
          curl -fsSL -o creator.tar "$url"
          mkdir -p "$HOME/cocos_creator"
          tar -xf creator.tar -C "$HOME/cocos_creator"
          chmod +x "$HOME/cocos_creator/CocosCreator"
          if [ -n "$CREATOR_LICENSE" ]; then
            mkdir -p "$HOME/.CocosCreator/licenses"
            echo "$CREATOR_LICENSE" | base64 -d > "$HOME/.CocosCreator/licenses/license.json"
          fi
      - name: 构建 Android 平台
        run: |
          "$HOME/cocos_creator/CocosCreator" --project "$GITHUB_WORKSPACE" --build "platform=android;debug=false"
      - name: Gradle 打包 APK
        run: |
          gradle -p build/android/proj assembleRelease
          mkdir -p build/android
          find build/android/proj -name "*.apk" -exec cp {} build/android/ \;
          index=0
          for f in build/android/*.apk; do
            if [ "$index" -eq 0 ]; then
              mv "$f" "build/android/testgame-${VERSION}.apk"
            else
              mv "$f" "build/android/testgame-${VERSION}-${index}.apk"
            fi
            index=$((index + 1))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/android/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: build/android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ${{ inputs.version || github.ref_name }}
          files: build/android/*.apk
