name: build_apk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 版本号 如 v0.1.0
        required: true
        type: string
      publish:
        description: 是否发布 Release
        required: false
        default: false
        type: boolean

env:
  COCOS_VERSION: 3.8.8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install
      - run: npm test

  build:
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: 跨目录导入消解
        run: |
          perl -pi -e 's#"\.\./\.\./src/#"./lib/#g' assets/scripts/bootstrap_bridge.ts
          cp -r src assets/scripts/lib
          find assets/scripts/lib -name "*.test.ts" -delete
      - name: 准备 JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - name: 准备 Android SDK
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          sdkmanager="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status="${PIPESTATUS[1]}"
          set -e
          if [ "$license_status" -ne 0 ]; then
            exit "$license_status"
          fi
          "$sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;23.1.7779620"
          echo "ANDROID_SDK_ROOT=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$android_sdk_root/ndk/23.1.7779620" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$android_sdk_root/ndk/23.1.7779620" >> "$GITHUB_ENV"
      - name: 安装 Cocos Creator
        env:
          CREATOR_LICENSE: ${{ secrets.CREATOR_LICENSE }}
          CREATOR_DOWNLOAD_URL: ${{ secrets.CREATOR_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          url="${CREATOR_DOWNLOAD_URL:-https://download.cocos.com/CocosCreator/v${COCOS_VERSION}/CocosCreator-v${COCOS_VERSION}-mac-121518.zip}"
          installer="$HOME/Library/Caches/cocos-creator/CocosCreator-v${COCOS_VERSION}-mac-121518.zip"
          mkdir -p "$(dirname "$installer")"
          curl -fsSL --retry 3 --retry-delay 10 -o "$installer" "$url"
          extract_dir="$RUNNER_TEMP/cocos-creator-${COCOS_VERSION}"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          ditto -x -k "$installer" "$extract_dir"
          creator_app="$(find "$extract_dir" -name CocosCreator.app -type d -print -quit)"
          rm -rf "$HOME/cocos_creator"
          mkdir -p "$HOME/cocos_creator"
          ditto "$creator_app" "$HOME/cocos_creator/CocosCreator.app"
          xattr -dr com.apple.quarantine "$HOME/cocos_creator/CocosCreator.app" || true
          cli="$HOME/cocos_creator/CocosCreator.app/Contents/MacOS/CocosCreator"
          test -x "$cli"
          echo "COCOS_CLI=$cli" >> "$GITHUB_ENV"
          if [ -n "$CREATOR_LICENSE" ]; then
            mkdir -p "$HOME/Library/Application Support/CocosCreator/licenses"
            echo "$CREATOR_LICENSE" | base64 -d > "$HOME/Library/Application Support/CocosCreator/licenses/license.json"
          fi
      - name: 构建 Android 平台
        run: |
          "$COCOS_CLI" --project "$GITHUB_WORKSPACE" --build "platform=android;debug=false"
      - name: Gradle 打包 APK
        run: |
          if [ -x build/android/proj/gradlew ]; then
            (cd build/android/proj && ./gradlew assembleRelease)
          else
            gradle -p build/android/proj assembleRelease
          fi
          mkdir -p build/android
          find build/android/proj -name "*.apk" -exec cp {} build/android/ \;
          index=0
          for f in build/android/*.apk; do
            if [ "$index" -eq 0 ]; then
              mv "$f" "build/android/testgame-${VERSION}.apk"
            else
              mv "$f" "build/android/testgame-${VERSION}-${index}.apk"
            fi
            index=$((index + 1))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/android/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: build/android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ${{ inputs.version || github.ref_name }}
          files: build/android/*.apk
